
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#F8F1EA" />
  
  <style>
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 0.8; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    .shape {
      fill: #D87C5A;
      transform-origin: center;
    }
    .bounce { animation: bounce 2s infinite ease-in-out; }
    .pulse { animation: pulse 3s infinite ease-in-out; }
    .sway { animation: sway 2s infinite ease-in-out; }
  </style>

  <g class="bounce" transform-origin="center">
    <rect x="160" y="120" width="80" height="160" rx="40" class="shape" />
  </g>
  <text x="200" y="320" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#2B2A28" text-anchor="middle" opacity="0.6">LEGS</text>
</svg>
